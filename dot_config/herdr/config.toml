onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
tab_bar_right = [
    { type = "zoom" },
    { type = "hostname" },
    { type = "datetime", format = "%H:%M" },
    { type = "text", text = "prod" },
    { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[worktrees]
directory = "~/.herdr/worktrees"

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle herdr reviewr"
